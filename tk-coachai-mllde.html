  .ov{position:fixed;inset:0;background:rgba(10,14,30,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:18px;z-index:70}

  .flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;margin:8px 0 4px}
  .step{flex:1 1 150px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:10px;padding:12px 12px}

  .dash{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
  .db{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}

  .db .n{font-weight:700;margin:4px 0 2px;font-size:14.5px;color:var(--primary-deep)}
  .db .d{font-size:12.5px;color:var(--muted)}
  .note{margin-top:22px;font-size:12.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:14px}
  @media(max-width:620px){.grid{grid-template-columns:1fr}.dash{grid-template-columns:1fr}.arrow{display:none}}
</style>
</head>

  function applyLang(L){
    lang=L; document.documentElement.setAttribute("lang",L);
    var t=T[L];
    document.querySelectorAll("[data-k]").forEach(function(el){
      var v=t[el.getAttribute("data-k")]; if(v==null) return;
      if(el.getAttribute("data-html")) el.innerHTML=v; else el.textContent=v;
    });
    document.getElementById("langBtn").textContent = (L==="es"?"EN":"ES");
    if(ov.classList.contains("open")&&curKey) renderModal(curKey);
    ls.set("tkv-lang",L);
  }
  function renderModal(key){
    curKey=key; var d=MOD[lang][key], t=T[lang];
    document.getElementById("mKick").textContent=d.k;
    document.getElementById("mTitle").textContent=d.t;
    document.getElementById("mBody").innerHTML="<p>"+d.b+"</p>";
    document.getElementById("mEx").textContent=d.ex;
    var lk=document.getElementById("mLink"); lk.href=REG+(ANCH[key]||""); lk.textContent=t.mlink;
    document.getElementById("mClose").textContent=t.mclose;
    var nav=document.getElementById("mNav"); nav.innerHTML="";
    order.forEach(function(k){
      var b=document.createElement("button"); b.type="button";
      b.className="mbtn"+(k===key?" cur":""); b.textContent=MOD[lang][k].t.replace(/ \(.*/,"");
      b.onclick=function(){renderModal(k);}; nav.appendChild(b);
    });
  }
  function openModal(key){ renderModal(key); ov.classList.add("open"); document.getElementById("mClose").focus(); }
  function closeModal(){ ov.classList.remove("open"); }

  function effTheme(){ var a=document.documentElement.getAttribute("data-theme");
    if(a) return a; return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"; }
  function applyTheme(mode){ // mode: 'light'|'dark'|null(system)
    if(mode) document.documentElement.setAttribute("data-theme",mode); else document.documentElement.removeAttribute("data-theme");
    document.getElementById("themeBtn").textContent = (effTheme()==="dark"?"☀️":"🌙");
    if(mode) ls.set("tkv-theme",mode); }

  // init
  var storedLang=ls.get("tkv-lang"); applyLang(storedLang==="en"?"en":"es");
  var storedTheme=ls.get("tkv-theme"); applyTheme(storedTheme==="light"||storedTheme==="dark"?storedTheme:null);

  document.getElementById("langBtn").addEventListener("click",function(){ applyLang(lang==="es"?"en":"es"); });
  document.getElementById("themeBtn").addEventListener("click",function(){ applyTheme(effTheme()==="dark"?"light":"dark"); });
  document.querySelectorAll(".pill[data-m]").forEach(function(p){ p.addEventListener("click",function(){ openModal(p.getAttribute("data-m")); }); });
  document.getElementById("mClose").addEventListener("click",closeModal);
  ov.addEventListener("click",function(e){ if(e.target===ov) closeModal(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });
})();
</script>
</body>
</html>
